<!DOCTYPE html>
<html>
<head>
    <title>Register | StudentHub</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="index.html">StudentHub Portal</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="login.html">Login</a></li>
                <li class="nav-item"><a class="nav-link" href="register.html">Register</a></li>
                <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" href="attendance.html">Attendance</a></li>
                <li class="nav-item"><a class="nav-link" href="assignment.html">Assignment</a></li>
                <li class="nav-item"><a class="nav-link" href="timetable.html">Timetable</a></li>
                <li class="nav-item"><a class="nav-link" href="notice.html">Notice</a></li>
                <li class="nav-item"><a class="nav-link" href="profile.html">Profile</a></li>
                <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
            </ul>
        </div>
    </div>
</nav>

<main class="site-container">
    <section class="card">
        <h2 class="page-title">Student Registration</h2>
        <form id="registerForm" class="needs-validation" novalidate>
            <div class="form-row">
                <label for="full-name">Full Name</label>
                <input id="full-name" name="full_name" type="text" placeholder="Full Name" required>
            </div>
            <div class="form-row">
                <label for="email">Email</label>
                <input id="email" name="email" type="email" placeholder="Email" required>
            </div>
            <div class="form-row">
                <label for="password">Password</label>
                <input id="password" name="password" type="password" placeholder="Password" required>
            </div>
            <div class="form-row">
                <label for="confirm_password">Confirm Password</label>
                <input id="confirm_password" name="confirm_password" type="password" placeholder="Confirm Password" required>
            </div>
            <input type="submit" value="Register">
            <p class="form-message" aria-live="polite"></p>
        </form>
        <p>Already have an account? <a href="login.html">Login here</a>.</p>
    </section>
</main>

<footer class="bg-light text-center text-muted py-3">
    © 2026 StudentHub Portal. Join StudentHub today.
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/script.js"></script>

</body>
</html>
